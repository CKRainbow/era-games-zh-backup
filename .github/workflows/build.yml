name: build-dist

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v2
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Cache Hugo resources
        uses: actions/cache@v3
        with:
          path: resources/_gen
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('**/hugo.toml', '**/config.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Cache Gitgud data
        uses: actions/cache@v4
        with:
          # 上一次成功抓取的数据：本次抓取失败的条目会回退到这里的值
          path: data/gitgud.json
          key: gitgud-data-${{ github.run_id }}
          restore-keys: |
            gitgud-data-

      - name: 2. Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.119.0"
          extended: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch Gitgud API data
        env:
          HUGO_GITGUD_ACCESS_TOKEN: ${{ secrets.HUGO_GITGUD_ACCESS_TOKEN }}
        run: python scripts/fetch_gitgud_data.py

      - name: Report data coverage
        if: always()
        run: |
          if [ -f data/fetch-report.md ]; then
            cat data/fetch-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 3. Build
        env: 
          HUGO_GITGUD_ACCESS_TOKEN: ${{ secrets.HUGO_GITGUD_ACCESS_TOKEN }}
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          hugo --minify
          echo '{ "github": { "silent": true } }' > public/vercel.json

      - name: 4. Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./public
          publish_branch: dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: ${{ github.event.head_commit.message }}
